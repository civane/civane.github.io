<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photography — Zhangxizi QIU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQZ5RO2VY0S4JQ7a2Y9lJGiR7p7Z1wE=" crossorigin="">
  <style>
    :root{--ink:#000;--paper:#f4efe5;--gold:#c99a52;--line:#302e2a;--muted:#aaa69f}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.topbar{height:106px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:1px solid var(--line)}.brand{color:var(--paper);font-family:Georgia,serif;font-size:2rem;font-weight:700;text-decoration:none}.brand span,.accent{color:var(--gold)}nav{display:flex;gap:clamp(18px,3vw,52px)}nav a{color:#d5d1ca;text-decoration:none;font-size:.78rem;letter-spacing:.13em}nav a:hover,nav a.active{color:var(--gold)}.intro{padding:clamp(65px,9vw,130px) 7vw 70px}.eyebrow{color:var(--gold);font-size:.78rem;letter-spacing:.16em;margin:0 0 22px}.eyebrow:before{content:'●';margin-right:10px;color:#f0cfaa}h1{max-width:1100px;margin:0;font:400 clamp(4.1rem,10vw,10rem)/.84 Georgia,serif;letter-spacing:-.07em}.intro p:last-child{max-width:540px;margin:38px 0 0;color:var(--muted);font:1.05rem/1.75 Arial,sans-serif}.atlas{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:620px}.map-wrap{position:relative;min-height:620px;border-right:1px solid var(--line);background:#111}.map-caption{position:absolute;z-index:600;left:28px;bottom:22px;pointer-events:none;color:#d6d0c8;font-size:.67rem;letter-spacing:.12em;text-shadow:0 1px 4px #000}.map-caption b{color:var(--gold);font-weight:500}.leaflet-container{height:100%;width:100%;background:#111;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#777!important;font-size:9px!important}.leaflet-control-attribution a{color:#a78959!important}.pin{width:16px;height:16px;border-radius:50%;background:var(--gold);border:3px solid #171511;box-shadow:0 0 0 1px #e7c486,0 0 16px rgba(201,154,82,.75);transition:transform .2s}.pin.active{transform:scale(1.45);background:#f4efe5}.panel{padding:clamp(34px,5vw,72px) clamp(28px,5vw,78px);overflow:auto}.place-meta{color:var(--gold);font-size:.72rem;letter-spacing:.15em}.place-title{margin:16px 0 8px;font:400 clamp(3.6rem,6vw,6.8rem)/.86 Georgia,serif;letter-spacing:-.07em}.place-count{margin:0 0 38px;color:var(--muted);font-size:.7rem;letter-spacing:.14em}.gallery{columns:2 170px;column-gap:12px}.photo{display:block;break-inside:avoid;margin:0 0 12px;background:#171511;overflow:hidden}.photo img{display:block;width:100%;height:auto;filter:saturate(.94) contrast(1.02);transition:transform .5s ease,filter .5s ease}.photo:hover img{transform:scale(1.025);filter:saturate(1.06) contrast(1.04)}.places-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:35px}.places-list button{cursor:pointer;border:1px solid var(--line);background:transparent;color:#bdb8af;padding:9px 11px;font:600 .65rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.places-list button:hover,.places-list button.active{border-color:var(--gold);color:var(--gold)}@media(max-width:860px){.topbar{height:auto;padding:24px 6%;align-items:flex-start;gap:20px;flex-direction:column}nav{gap:14px;flex-wrap:wrap}.intro{padding:78px 7vw 60px}.atlas{display:block}.map-wrap{height:440px;min-height:0;border-right:0;border-bottom:1px solid var(--line)}.panel{padding:54px 7vw}.place-title{font-size:clamp(3.6rem,14vw,6rem)}.gallery{columns:2 150px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">ZQ<span>•</span></a><nav><a href="index.html#profile">PROFILE</a><a href="index.html#journey">JOURNEY</a><a href="work.html">SELECTED WORK</a><a class="active" href="photography.html">PHOTOGRAPHY</a></nav></header>
  <main><section class="intro"><p class="eyebrow">VISUAL DIARY / 2026</p><h1>Seen along<br><em class="accent">the way.</em></h1><p>Click a point on the map to open the photographs I made there — a small atlas of colours, light and passing moments.</p></section><section class="atlas"><div class="map-wrap"><div id="map" aria-label="Interactive world map of photography locations"></div><p class="map-caption"><b>●</b> SELECT A PLACE</p></div><aside class="panel"><p class="place-meta" id="place-meta"></p><h2 class="place-title" id="place-title"></h2><p class="place-count" id="place-count"></p><div class="gallery" id="gallery"></div><div class="places-list" id="places-list" aria-label="Photography locations"></div></aside></section></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const places={
      rome:{name:'Rome',region:'ITALY',coords:[41.9028,12.4964],photos:['DSC02937','DSC03028','DSC03329','DSC03358','DSC03381','DSC03411','DSC03446','DSC03456']},
      tokyo:{name:'Tokyo',region:'JAPAN',coords:[35.6762,139.6503],photos:['DSC03557','DSC06559_VSCO','DSC06567_VSCO','DSC06818_VSCO','DSC06919_VSCO','DSC07079','DSC07117','DSC07205','DSC07243']},
      nice:{name:'Nice',region:'FRANCE',coords:[43.7102,7.2620],photos:['0666c1633f98274cacac5aebe0481810','30c8cdf258bf46bff2702a2c5a8f20d8','DSC04714','d94b5b3208b4f284715cc920945877fc','dddb9861ad4d40f5284e8f3eccd12c03']},
      berlin:{name:'Berlin',region:'GERMANY',coords:[52.5200,13.4050],photos:['DSC03825','DSC04015','aa70a68d7f9c7adbff15702cf446936e']},
      marseille:{name:'Marseille',region:'FRANCE',coords:[43.2965,5.3698],photos:['DSC02525','DSC02549','DSC02670','DSC02751_VSCO']},
      mongolia:{name:'Inner Mongolia',region:'CHINA',coords:[40.8426,111.7492],folder:'Inner-Mongolia',photos:['DSC01377_VSCO','DSC01395','DSC01620','DSC01687_VSCO','DSC02134','DSC02366','DSC02465_VSCO']},
      kyoto:{name:'Kyoto',region:'JAPAN',coords:[35.0116,135.7681],photos:['DSC08376','DSC08377','DSC08477','DSC08593','DSC08621','DSC08654','DSC08676','DSC08696']},
      dubai:{name:'Dubai',region:'UAE',coords:[25.2048,55.2708],photos:['DSC09400','DSC09417','DSC09551','DSC09629','DSC09691','DSC09988']},
      sichuan:{name:'Sichuan',region:'CHINA',coords:[30.5728,104.0668],photos:['DSC06921','DSC07062','DSC07077','DSC07130','DSC07160','DSC07313','DSC07313 2']}
    };
    const map=L.map('map',{zoomControl:false,scrollWheelZoom:false,attributionControl:true}).setView([31,50],2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
    const markers={},gallery=document.querySelector('#gallery'),title=document.querySelector('#place-title'),meta=document.querySelector('#place-meta'),count=document.querySelector('#place-count'),buttons=document.querySelector('#places-list');
    function icon(active=false){return L.divIcon({className:'',html:`<div class="pin${active?' active':''}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}
    function selectPlace(key,pan=true){const p=places[key];title.textContent=p.name;meta.textContent=`${String(Object.keys(places).indexOf(key)+1).padStart(2,'0')} / ${p.region}`;count.textContent=`${p.photos.length} FRAMES`;
      gallery.innerHTML=p.photos.map((photo,i)=>`<figure class="photo"><img ${i<3?'loading="eager"':'loading="lazy"'} src="assets/photography/${p.folder||p.name}/${photo}.jpg" alt="${p.name} travel photograph"></figure>`).join('');
      Object.entries(markers).forEach(([id,m])=>m.setIcon(icon(id===key)));document.querySelectorAll('.places-list button').forEach(b=>b.classList.toggle('active',b.dataset.place===key));if(pan)map.flyTo(p.coords,Math.max(map.getZoom(),4),{duration:.8});
    }
    Object.entries(places).forEach(([key,p])=>{const m=L.marker(p.coords,{icon:icon()}).addTo(map).bindTooltip(p.name,{direction:'top',offset:[0,-9],opacity:.9});m.on('click',()=>selectPlace(key));markers[key]=m;const b=document.createElement('button');b.textContent=p.name;b.dataset.place=key;b.onclick=()=>selectPlace(key);buttons.append(b)});
    selectPlace('rome',false);
  </script>
</body>
</html>
