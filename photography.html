<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photography — Zhangxizi QIU</title>
  <style>
    :root{--ink:#000;--paper:#f4efe5;--gold:#c99a52;--line:#302e2a;--muted:#aaa69f}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.topbar{height:106px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;border-bottom:1px solid var(--line)}.brand{color:var(--paper);font-family:Georgia,serif;font-size:2rem;font-weight:700;text-decoration:none}.brand span,.accent{color:var(--gold)}nav{display:flex;gap:clamp(18px,3vw,52px)}nav a{color:#d5d1ca;text-decoration:none;font-size:.78rem;letter-spacing:.13em}nav a:hover,nav a.active{color:var(--gold)}.intro{padding:clamp(70px,10vw,145px) 7vw 70px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font-size:.78rem;letter-spacing:.16em;margin:0 0 22px}.eyebrow:before{content:'●';margin-right:10px;color:#f0cfaa}h1{max-width:1100px;margin:0;font:400 clamp(4.1rem,10vw,10rem)/.84 Georgia,serif;letter-spacing:-.07em}.intro p:last-child{max-width:540px;margin:38px 0 0;color:var(--muted);font:1.05rem/1.75 Arial,sans-serif}.picker{padding:clamp(38px,5vw,70px) 7vw;border-bottom:1px solid var(--line);background:#111210}.picker-label{margin:0 0 20px;color:var(--gold);font-size:.7rem;letter-spacing:.15em}.places-list{display:flex;flex-wrap:wrap;gap:10px}.places-list button{cursor:pointer;border:1px solid #4a463e;background:transparent;color:#d2cdc4;padding:13px 18px;font:600 .78rem ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;transition:background .2s,color .2s,border-color .2s}.places-list button:hover{border-color:#c99a52;color:#c99a52}.places-list button.active{background:#c99a52;border-color:#c99a52;color:#100e0b}.places-list button:focus-visible{outline:2px solid #f4efe5;outline-offset:3px}.gallery-section{padding:clamp(60px,8vw,118px) 7vw}.place-meta{margin:0;color:var(--gold);font-size:.72rem;letter-spacing:.15em}.place-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin:18px 0 48px;padding-bottom:25px;border-bottom:1px solid var(--line)}.place-title{margin:0;font:400 clamp(4rem,8vw,8rem)/.82 Georgia,serif;letter-spacing:-.07em}.place-count{margin:0 0 7px;color:var(--muted);font-size:.72rem;letter-spacing:.15em;white-space:nowrap}.gallery{columns:4 175px;column-gap:14px}.photo{display:block;break-inside:avoid;margin:0 0 14px;background:#141311;overflow:hidden}.photo img{display:block;width:100%;height:auto;filter:saturate(.94) contrast(1.02);transition:transform .55s ease,filter .55s ease}.photo:hover img{transform:scale(1.025);filter:saturate(1.06) contrast(1.04)}@media(max-width:780px){.topbar{height:auto;padding:24px 6%;align-items:flex-start;gap:20px;flex-direction:column}nav{gap:14px;flex-wrap:wrap}.intro{padding:78px 7vw 60px}.picker,.gallery-section{padding-left:7vw;padding-right:7vw}.places-list{gap:8px}.places-list button{padding:10px 12px;font-size:.7rem}.place-head{margin-bottom:30px}.place-title{font-size:clamp(4rem,15vw,6.4rem)}.gallery{columns:2 150px;column-gap:9px}.photo{margin-bottom:9px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">ZQ<span>•</span></a><nav><a href="index.html#profile">PROFILE</a><a href="index.html#journey">JOURNEY</a><a href="work.html">SELECTED WORK</a><a class="active" href="photography.html">PHOTOGRAPHY</a></nav></header>
  <main><section class="intro"><p class="eyebrow">VISUAL DIARY / 2026</p><h1>Seen along<br><em class="accent">the way.</em></h1><p>Pick a place to open the photographs I made there — a quiet archive of colour, light and passing moments.</p></section><section class="picker"><p class="picker-label">CHOOSE A PLACE</p><div class="places-list" id="places-list" aria-label="Photography locations"></div></section><section class="gallery-section"><p class="place-meta" id="place-meta"></p><div class="place-head"><h2 class="place-title" id="place-title"></h2><p class="place-count" id="place-count"></p></div><div class="gallery" id="gallery"></div></section></main>
  <script>
    const places={
      rome:{name:'Rome',region:'ITALY',photos:['DSC02937','DSC03028','DSC03329','DSC03358','DSC03381','DSC03411','DSC03446','DSC03456']},
      tokyo:{name:'Tokyo',region:'JAPAN',photos:['DSC03557','DSC06559_VSCO','DSC06567_VSCO','DSC06818_VSCO','DSC06919_VSCO','DSC07079','DSC07117','DSC07205','DSC07243']},
      nice:{name:'Nice',region:'FRANCE',photos:['0666c1633f98274cacac5aebe0481810','30c8cdf258bf46bff2702a2c5a8f20d8','DSC04714','d94b5b3208b4f284715cc920945877fc','dddb9861ad4d40f5284e8f3eccd12c03']},
      berlin:{name:'Berlin',region:'GERMANY',photos:['DSC03825','DSC04015','aa70a68d7f9c7adbff15702cf446936e']},
      marseille:{name:'Marseille',region:'FRANCE',photos:['DSC02525','DSC02549','DSC02670','DSC02751_VSCO']},
      mongolia:{name:'Inner Mongolia',region:'CHINA',folder:'Inner-Mongolia',photos:['DSC01377_VSCO','DSC01395','DSC01620','DSC01687_VSCO','DSC02134','DSC02366','DSC02465_VSCO']},
      kyoto:{name:'Kyoto',region:'JAPAN',photos:['DSC08376','DSC08377','DSC08477','DSC08593','DSC08621','DSC08654','DSC08676','DSC08696']},
      dubai:{name:'Dubai',region:'UAE',photos:['DSC09400','DSC09417','DSC09551','DSC09629','DSC09691','DSC09988']},
      sichuan:{name:'Sichuan',region:'CHINA',photos:['DSC06921','DSC07062','DSC07077','DSC07130','DSC07160','DSC07313','DSC07313 2']}
    };
    const gallery=document.querySelector('#gallery'),title=document.querySelector('#place-title'),meta=document.querySelector('#place-meta'),count=document.querySelector('#place-count'),buttons=document.querySelector('#places-list');
    function selectPlace(key){const p=places[key];title.textContent=p.name;meta.textContent=`${String(Object.keys(places).indexOf(key)+1).padStart(2,'0')} / ${p.region}`;count.textContent=`${p.photos.length} FRAMES`;gallery.innerHTML=p.photos.map((photo,i)=>`<figure class="photo"><img ${i<3?'loading="eager"':'loading="lazy"'} src="assets/photography/${p.folder||p.name}/${photo}.jpg" alt="${p.name} travel photograph"></figure>`).join('');document.querySelectorAll('.places-list button').forEach(b=>b.classList.toggle('active',b.dataset.place===key));}
    Object.entries(places).forEach(([key,p])=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.place=key;b.onclick=()=>selectPlace(key);buttons.append(b)});selectPlace('rome');
  </script>
</body>
</html>
